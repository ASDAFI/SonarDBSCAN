[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonardbscan"
version = "0.1.0"
authors = [
  { name="Ali Sadafi", email="ali.sdfi.dev@gmail.com" },
]
description = "A distributed PySpark DBSCAN implementation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=3.0.0",
    "graphframes>=0.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]